<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yataş International - Product Configurator & Proforma</title>

  <!-- Font & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- ExcelJS & FileSaver CDN (Görselli Excel Export İçin) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <style>
    :root {
      --bg-dark: #070c1a;
      --card-bg: #0d162d;
      --panel-bg: #091024;
      --border-color: #1a2747;
      --primary-blue: #0099ff;
      --accent-cyan: #00d2ff;
      --text-main: #ffffff;
      --text-muted: #8a99ad;
      --badge-mto: #e63946;
      --badge-mts: #2a9d8f;
      --btn-green: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Open Sans', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Ana Düzen */
    .app-container {
      display: flex;
      width: 100%;
    }

    .main-content {
      flex: 1;
      padding: 30px;
    }

    .header-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 24px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Ürün Grid */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    /* 1. GÖRSEL REVIZYONLARI: Ürün Kartı */
    .product-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
    }

    .product-card:hover {
      transform: translateY(-4px);
      border-color: var(--primary-blue);
      box-shadow: 0 8px 24px rgba(0, 153, 255, 0.15);
    }

    .card-image-wrap {
      position: relative;
      width: 100%;
      height: 200px;
      background-color: #050914;
    }

    .card-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .badge-sizes {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(13, 37, 89, 0.85);
      border: 1px solid var(--primary-blue);
      color: var(--accent-cyan);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      backdrop-filter: blur(4px);
    }

    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .brand-category {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .product-name {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    /* Yaylı Mattress Yerine Sipariş Statüsü (MTO / MTS) */
    .order-status-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      width: fit-content;
      margin-bottom: 16px;
    }
    .status-mto { background-color: rgba(230, 57, 70, 0.2); color: #ff6b6b; border: 1px solid rgba(230, 57, 70, 0.4); }
    .status-mts { background-color: rgba(42, 157, 143, 0.2); color: #48cae4; border: 1px solid rgba(42, 157, 143, 0.4); }

    .card-footer {
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .price-from {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent-cyan);
    }

    .btn-configure {
      background-color: #ffffff;
      color: var(--card-bg);
      border: none;
      padding: 8px 18px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-configure:hover {
      background-color: #e2e8f0;
    }

    /* Modal (2. GÖRSEL REVIZYONLARI) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(3, 7, 18, 0.85);
      backdrop-filter: blur(6px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-container {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      width: 90%;
      max-width: 820px;
      display: flex;
      overflow: hidden;
      position: relative;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .modal-left {
      width: 45%;
      background: #000;
    }

    .modal-left img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .modal-right {
      width: 55%;
      padding: 32px;
      display: flex;
      flex-direction: column;
    }

    .modal-header-category {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-cyan);
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .modal-title {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .select-group {
      background: rgba(5, 12, 28, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .select-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.8px;
      margin-bottom: 8px;
      display: block;
    }

    .custom-select {
      width: 100%;
      background: var(--bg-dark);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      outline: none;
    }

    /* 4 İkonlu Bilgi Grid'i (HS Code, Vol, Wt, Height) */
    .info-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .info-box {
      background: var(--bg-dark);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 6px;
      padding: 8px 4px;
      text-align: center;
    }

    .info-box .title {
      font-size: 9px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .info-box .val {
      font-size: 11px;
      font-weight: 700;
      color: #fff;
    }

    .modal-action-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: auto;
      padding-top: 16px;
    }

    .qty-picker {
      display: flex;
      align-items: center;
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 6px;
    }

    .qty-btn {
      background: none;
      border: none;
      color: #fff;
      width: 32px;
      height: 36px;
      cursor: pointer;
      font-weight: bold;
    }

    .qty-input {
      width: 36px;
      background: none;
      border: none;
      color: #fff;
      text-align: center;
      font-weight: bold;
    }

    .modal-price {
      font-size: 22px;
      font-weight: 700;
      color: var(--accent-cyan);
    }

    .btn-add-proforma {
      width: 100%;
      background: var(--primary-blue);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      margin-top: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }

    .btn-add-proforma:hover {
      background: #0088ee;
    }

    /* Proforma Sidebar (4. GÖRSEL REVIZYONLARI) */
    .proforma-sidebar {
      width: 380px;
      background: var(--panel-bg);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: sticky;
      top: 0;
    }

    .sidebar-header {
      padding: 24px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-header h2 {
      font-size: 18px;
      font-weight: 700;
    }

    .cart-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Proforma Sipariş Kartı ve Anlık Adet Değiştirme */
    .cart-item {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      gap: 12px;
      position: relative;
    }

    .cart-item-img {
      width: 54px;
      height: 54px;
      border-radius: 6px;
      object-fit: cover;
      cursor: pointer;
    }

    .cart-item-details {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      cursor: pointer; /* Tıklanınca detaya döner */
    }

    .cart-item-title {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .cart-item-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .cart-item-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .inline-qty-picker {
      display: flex;
      align-items: center;
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 4px;
    }

    .inline-qty-btn {
      background: none;
      border: none;
      color: #fff;
      width: 24px;
      height: 24px;
      cursor: pointer;
      font-size: 12px;
    }

    .inline-qty-val {
      width: 26px;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-cyan);
    }

    .cart-item-total {
      font-size: 13px;
      font-weight: 700;
    }

    .btn-delete-item {
      color: #ef4444;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 13px;
      padding: 4px;
      position: absolute;
      top: 8px;
      right: 8px;
    }

    /* Logistics & Export Bottom Section */
    .sidebar-footer {
      padding: 20px;
      border-top: 1px solid var(--border-color);
      background: #060b18;
    }

    .logistics-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 16px;
    }

    .logistics-title {
      font-size: 10px;
      font-weight: 700;
      color: var(--primary-blue);
      letter-spacing: 0.8px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .logistics-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      margin-bottom: 4px;
    }

    .logistics-sub {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px dashed rgba(255,255,255,0.1);
    }

    .grand-total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .grand-total-row span {
      font-size: 14px;
      font-weight: 700;
    }

    .grand-total-row .amount {
      font-size: 20px;
      color: var(--accent-cyan);
    }

    .btn-export-excel {
      width: 100%;
      background: var(--btn-green);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s;
    }

    .btn-export-excel:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Ana İçerik Alanı -->
    <main class="main-content">
      <div class="header-title">
        <i class="fa-solid fa-bed"></i> Yataş Bedding Catalog
      </div>
      <div class="product-grid" id="productGrid"></div>
    </main>

    <!-- Proforma Yan Paneli -->
    <aside class="proforma-sidebar">
      <div class="sidebar-header">
        <h2>Proforma Order Summary</h2>
      </div>

      <div class="cart-list" id="cartList"></div>

      <div class="sidebar-footer">
        <div class="logistics-card">
          <div class="logistics-title">
            <i class="fa-solid fa-truck-fast"></i> LOGISTICS & VEHICLE CAPACITY
          </div>
          <div class="logistics-row">
            <span>40' HQ Container (68 m³)</span>
            <span id="contFill">0 Cont. (%0 full)</span>
          </div>
          <div class="logistics-row">
            <span>Standard Truck (70 m³)</span>
            <span id="truckFill">0 Truck (%0 full)</span>
          </div>
          <div class="logistics-sub" id="logisticsMetrics">
            Total Vol: 0 m³ | Total Wt: 0 kg
          </div>
        </div>

        <div class="grand-total-row">
          <span>Grand Total:</span>
          <span class="amount" id="grandTotal">$0.00</span>
        </div>

        <button class="btn-export-excel" onclick="exportToExcelWithPhotos()">
          <i class="fa-solid fa-file-excel"></i> Export Excel Order with Photos
        </button>
      </div>
    </aside>
  </div>

  <!-- Ürün Konfigürasyon Modalı -->
  <div class="modal-overlay" id="productModal">
    <div class="modal-container">
      <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
      <div class="modal-left">
        <img id="modalImg" src="" alt="Product Detail">
      </div>
      <div class="modal-right">
        <!-- 2. GÖRSEL REVIZYONLARI: Parantez içindeki detay silindi -->
        <div class="modal-header-category" id="modalCategory">YATAŞ BEDDING | MATTRESS</div>
        <div class="modal-title" id="modalTitle">Activio</div>

        <div class="select-group">
          <!-- 2. GÖRSEL REVIZYONLARI: Sadece Ölçü Yazan Dropdown -->
          <label class="select-label">SELECT DIMENSION / SIZE</label>
          <select class="custom-select" id="sizeSelect" onchange="onSizeChange()"></select>

          <!-- 2. GÖRSEL REVIZYONLARI: 4. Bilgi Kartı (Yükseklik / Height) Eklendi -->
          <div class="info-grid">
            <div class="info-box">
              <div class="title">HS CODE</div>
              <div class="val" id="infoHsCode">-</div>
            </div>
            <div class="info-box">
              <div class="title">UNIT VOL</div>
              <div class="val" id="infoVol">-</div>
            </div>
            <div class="info-box">
              <div class="title">UNIT WT</div>
              <div class="val" id="infoWt">-</div>
            </div>
            <div class="info-box">
              <div class="title">HEIGHT</div>
              <div class="val" id="infoHeight">-</div>
            </div>
          </div>
        </div>

        <div class="modal-action-row">
          <div class="qty-picker">
            <button class="qty-btn" onclick="adjustModalQty(-1)">-</button>
            <input type="text" class="qty-input" id="modalQty" value="1" readonly>
            <button class="qty-btn" onclick="adjustModalQty(1)">+</button>
          </div>
          <div class="modal-price" id="modalPrice">$0.00</div>
        </div>

        <button class="btn-add-proforma" onclick="addToProforma()">
          <i class="fa-solid fa-cart-plus"></i> Add to Proforma Order
        </button>
      </div>
    </div>
  </div>

  <script>
    // tr_yeni.xlsx Veri Seti Tabanlı Ürün Verileri
    const rawProductsData = [
      {
        code: "50501003380001",
        brand: "Yataş Bedding",
        category: "Yatak",
        family: "Activio",
        status: "MTO",
        size: "090X190",
        height: "31.0 cm",
        priceUsd: 179,
        priceEur: 154,
        barcode: "8684177543298",
        gtip: "940429100000",
        vol: 0.513,
        wt: 22.05,
        img: "https://yatasinternational.github.io/Products-Photos/50501003380001.png"
      },
      {
        code: "50501003380002",
        brand: "Yataş Bedding",
        category: "Yatak",
        family: "Activio",
        status: "MTO",
        size: "090X200",
        height: "31.0 cm",
        priceUsd: 179,
        priceEur: 154,
        barcode: "8684177543304",
        gtip: "940429100000",
        vol: 0.540,
        wt: 23.21,
        img: "https://yatasinternational.github.io/Products-Photos/50501003380001.png"
      },
      {
        code: "50501003380003",
        brand: "Yataş Bedding",
        category: "Yatak",
        family: "Activio",
        status: "MTS",
        size: "100X200",
        height: "31.0 cm",
        priceUsd: 189,
        priceEur: 163,
        barcode: "8684177543311",
        gtip: "940429100000",
        vol: 0.600,
        wt: 26.26,
        img: "https://yatasinternational.github.io/Products-Photos/50501003380001.png"
      },
      {
        code: "50501003380004",
        brand: "Yataş Bedding",
        category: "Yatak",
        family: "Activio",
        status: "MTS",
        size: "120X200",
        height: "31.0 cm",
        priceUsd: 198,
        priceEur: 171,
        barcode: "8684177543328",
        gtip: "940429100000",
        vol: 0.720,
        wt: 31.01,
        img: "https://yatasinternational.github.io/Products-Photos/50501003380001.png"
      },
      {
        code: "50501003380005",
        brand: "Yataş Bedding",
        category: "Yatak",
        family: "Activio",
        status: "MTS",
        size: "140X190",
        height: "31.0 cm",
        priceUsd: 217,
        priceEur: 187,
        barcode: "8684177543335",
        gtip: "940429100000",
        vol: 0.798,
        wt: 34.73,
        img: "https://yatasinternational.github.io/Products-Photos/50501003380001.png"
      }
    ];

    // Ürünleri Ailelerine Göre Gruplama Mantığı
    const groupedProducts = {};
    rawProductsData.forEach(p => {
      if (!groupedProducts[p.family]) {
        groupedProducts[p.family] = {
          family: p.family,
          brand: p.brand,
          category: p.category,
          status: p.status,
          img: p.img,
          variants: []
        };
      }
      groupedProducts[p.family].variants.push(p);
    });

    let proformaCart = [];
    let currentSelectedFamily = null;
    let currentSelectedVariant = null;

    // 1. GÖRSEL REVIZYONLARI: Ana Sayfadaki Kartları Render Etme
    function renderProductGrid() {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = '';

      Object.values(groupedProducts).forEach(prod => {
        const minPrice = Math.min(...prod.variants.map(v => v.priceUsd));
        const sizeCount = prod.variants.length;

        const card = document.createElement('div');
        card.className = 'product-card';
        // 1. GÖRSEL REVIZYONLARI: Kartın tamamına tıklayınca modal açılması
        card.onclick = () => openProductModal(prod.family);

        card.innerHTML = `
          <div class="card-image-wrap">
            <span class="badge-sizes">${sizeCount} Sizes</span>
            <img src="${prod.img}" alt="${prod.family}">
          </div>
          <div class="card-body">
            <div class="brand-category">${prod.brand.toUpperCase()} | ${prod.category.toUpperCase()}</div>
            <div class="product-name">${prod.family}</div>
            
            <!-- 1. GÖRSEL REVIZYONLARI: "Yaylı Mattress" yerine MTO / MTS Statüsü -->
            <div class="order-status-badge ${prod.status === 'MTO' ? 'status-mto' : 'status-mts'}">
              ${prod.status === 'MTO' ? 'Order Status: MTO' : 'Order Status: MTS'}
            </div>

            <div class="card-footer">
              <div class="price-from">from $${minPrice}</div>
              <button class="btn-configure" onclick="event.stopPropagation(); openProductModal('${prod.family}')">Configure</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // 2. GÖRSEL REVIZYONLARI: Detay Modalı Açma ve Doldurma
    function openProductModal(familyKey, targetCode = null) {
      const prod = groupedProducts[familyKey];
      currentSelectedFamily = prod;

      document.getElementById('modalImg').src = prod.img;
      // Parantez içindeki yaylı yazısı tamamen temizlendi
      document.getElementById('modalCategory').innerText = `${prod.brand.toUpperCase()} | ${prod.category.toUpperCase()}`;
      document.getElementById('modalTitle').innerText = prod.family;

      const select = document.getElementById('sizeSelect');
      select.innerHTML = '';

      // Dropdown içinden ürün adını kaldırıp sadece ölçüyü yazdırma
      prod.variants.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v.code;
        opt.innerText = v.size; // Sadece "090X190" formatı
        select.appendChild(opt);
      });

      if (targetCode) {
        select.value = targetCode;
      }

      document.getElementById('modalQty').value = 1;
      onSizeChange();

      document.getElementById('productModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('productModal').classList.remove('active');
    }

    function onSizeChange() {
      const selectedCode = document.getElementById('sizeSelect').value;
      currentSelectedVariant = currentSelectedFamily.variants.find(v => v.code === selectedCode);

      document.getElementById('infoHsCode').innerText = currentSelectedVariant.gtip;
      document.getElementById('infoVol').innerText = `${currentSelectedVariant.vol} m³`;
      document.getElementById('infoWt').innerText = `${currentSelectedVariant.wt} kg`;
      document.getElementById('infoHeight').innerText = currentSelectedVariant.height; // 4. Eklenen Bilgi
      document.getElementById('modalPrice').innerText = `$${currentSelectedVariant.priceUsd.toFixed(2)}`;
    }

    function adjustModalQty(delta) {
      const input = document.getElementById('modalQty');
      let val = parseInt(input.value) + delta;
      if (val < 1) val = 1;
      input.value = val;
    }

    // Sepete Ekleme
    function addToProforma() {
      const qty = parseInt(document.getElementById('modalQty').value);
      const existingIndex = proformaCart.findIndex(item => item.code === currentSelectedVariant.code);

      if (existingIndex > -1) {
        proformaCart[existingIndex].qty += qty;
      } else {
        proformaCart.push({
          ...currentSelectedVariant,
          qty: qty
        });
      }

      closeModal();
      renderProformaSummary();
    }

    // 4. GÖRSEL REVIZYONLARI: Sepette Anlık Adet Değiştirme & Ürüne Tıklayınca Modala Dönüş
    function renderProformaSummary() {
      const cartList = document.getElementById('cartList');
      cartList.innerHTML = '';

      let grandTotal = 0;
      let totalVol = 0;
      let totalWt = 0;

      proformaCart.forEach((item, index) => {
        const itemTotal = item.priceUsd * item.qty;
        grandTotal += itemTotal;
        totalVol += item.vol * item.qty;
        totalWt += item.wt * item.qty;

        const div = document.createElement('div');
        div.className = 'cart-item';
        div.innerHTML = `
          <button class="btn-delete-item" onclick="deleteCartItem(${index})"><i class="fa-solid fa-trash"></i></button>
          
          <!-- Görsel ve İsme Tıklanınca Modala Dönüş -->
          <img src="${item.img}" class="cart-item-img" onclick="openProductModal('${item.family}', '${item.code}')">
          
          <div class="cart-item-details" onclick="openProductModal('${item.family}', '${item.code}')">
            <div class="cart-item-title">${item.family} (${item.size})</div>
            <div class="cart-item-sub">$${item.priceUsd} / unit</div>
            
            <div class="cart-item-controls" onclick="event.stopPropagation()">
              <!-- Inline Adet Artırma / Azaltma (+ / -) -->
              <div class="inline-qty-picker">
                <button class="inline-qty-btn" onclick="updateCartQty(${index}, -1)">-</button>
                <span class="inline-qty-val">${item.qty}</span>
                <button class="inline-qty-btn" onclick="updateCartQty(${index}, 1)">+</button>
              </div>
              <div class="cart-item-total">$${itemTotal.toFixed(2)}</div>
            </div>
          </div>
        `;
        cartList.appendChild(div);
      });

      // Lojistik Metrikleri
      document.getElementById('grandTotal').innerText = `$${grandTotal.toFixed(2)}`;
      document.getElementById('logisticsMetrics').innerText = `Total Vol: ${totalVol.toFixed(3)} m³ | Total Wt: ${totalWt.toFixed(2)} kg`;

      const contPercent = Math.min(Math.round((totalVol / 68) * 100), 100);
      const truckPercent = Math.min(Math.round((totalVol / 70) * 100), 100);

      document.getElementById('contFill').innerText = `1 Cont. (%${contPercent} full)`;
      document.getElementById('truckFill').innerText = `1 Truck (%${truckPercent} full)`;
    }

    function updateCartQty(index, delta) {
      proformaCart[index].qty += delta;
      if (proformaCart[index].qty <= 0) {
        proformaCart.splice(index, 1);
      }
      renderProformaSummary();
    }

    function deleteCartItem(index) {
      proformaCart.splice(index, 1);
      renderProformaSummary();
    }

    // 3. GÖRSEL REVIZYONLARI: Optimum Görsel Boyutlu & Tam TR Verili Excel Export
    async function exportToExcelWithPhotos() {
      if (proformaCart.length === 0) {
        alert("Proforma sipariş listeniz boş!");
        return;
      }

      const workbook = new ExcelJS.Workbook();
      const worksheet = workbook.addWorksheet('TR Order Summary');

      // Excel Sütun Yapısı (TR Data ile Tam Birebir)
      worksheet.columns = [
        { header: 'Image', key: 'img', width: 18 },
        { header: 'Brand', key: 'brand', width: 16 },
        { header: 'Product Category', key: 'category', width: 16 },
        { header: 'Product Family', key: 'family', width: 16 },
        { header: 'Dimension / Size', key: 'size', width: 18 },
        { header: 'Height (CM)', key: 'height', width: 14 },
        { header: 'Order Status', key: 'status', width: 14 },
        { header: 'Product Code', key: 'code', width: 18 },
        { header: 'Barcode', key: 'barcode', width: 16 },
        { header: 'HS CODE (GTİP)', key: 'gtip', width: 18 },
        { header: 'Qty', key: 'qty', width: 10 },
        { header: 'Unit Price (USD)', key: 'priceUsd', width: 16 },
        { header: 'Total Price (USD)', key: 'totalPriceUsd', width: 18 },
        { header: 'Total Vol (m³)', key: 'totalVol', width: 16 },
        { header: 'Total Wt (kg)', key: 'totalWt', width: 16 }
      ];

      // Header Stil Düzenlemesi (Koyu Mavi Kurumsal Stil)
      const headerRow = worksheet.getRow(1);
      headerRow.height = 28;
      headerRow.eachCell(cell => {
        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: '001B48' } };
        cell.font = { color: { argb: 'FFFFFF' }, bold: true, size: 11 };
        cell.alignment = { vertical: 'middle', horizontal: 'center' };
      });

      // Satırların Eklemesi ve Görsel Ölçeklendirme
      for (let i = 0; i < proformaCart.length; i++) {
        const item = proformaCart[i];
        const rowIndex = i + 2;

        const row = worksheet.addRow({
          brand: item.brand,
          category: item.category,
          family: item.family,
          size: item.size,
          height: item.height,
          status: item.status,
          code: item.code,
          barcode: item.barcode,
          gtip: item.gtip,
          qty: item.qty,
          priceUsd: `${item.priceUsd} USD`,
          totalPriceUsd: `${(item.priceUsd * item.qty).toFixed(2)} USD`,
          totalVol: (item.vol * item.qty).toFixed(3),
          totalWt: (item.wt * item.qty).toFixed(2)
        });

        // Optimum Fotoğraf Boyutu İçin Yükseklik
        row.height = 70;
        row.eachCell(cell => {
          cell.alignment = { vertical: 'middle', horizontal: 'center' };
        });

        // Görseli Base64/Buffer Olarak Çekip Excel'e Ekleme
        try {
          const response = await fetch(item.img);
          const blob = await response.blob();
          const arrayBuffer = await blob.arrayBuffer();

          const imageId = workbook.addImage({
            buffer: arrayBuffer,
            extension: 'png',
          });

          worksheet.addImage(imageId, {
            tl: { col: 0, row: rowIndex - 1 },
            ext: { width: 85, height: 85 }, // Optimum görsel boyutu
            editAs: 'oneCell'
          });
        } catch (e) {
          console.warn("Görsel yüklenemedi:", e);
        }
      }

      // Dosyayı İndirme
      const buffer = await workbook.xlsx.writeBuffer();
      saveAs(new Blob([buffer]), `Proforma_Order_${new Date().toISOString().slice(0,10)}.xlsx`);
    }

    // Uygulama Başlatma
    window.onload = () => {
      renderProductGrid();
      renderProformaSummary();
    };
  </script>
</body>
</html>
