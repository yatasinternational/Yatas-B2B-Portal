<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Yataş Group - International Experience & B2B Order Portal</title>
    
    <!-- PWA & Mobile Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#020617">

    <!-- Third-Party Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-blue: #002870;
            --neon-blue: #00d2ff;
            --accent-gold: #c5a059;
            --dark-bg: #020617;
            --glass-bg: rgba(2, 6, 23, 0.92);
            --glass-border: rgba(255, 255, 255, 0.08);
            --card-bg: rgba(0, 40, 112, 0.25);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background: var(--dark-bg);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        /* BACKGROUND MESH GRADIENT */
        .premium-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: var(--dark-bg);
            overflow: hidden;
        }
        .premium-bg::before {
            content: "";
            position: absolute;
            top: -20%; left: -20%; width: 140%; height: 140%;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 40, 112, 0.55) 0%, transparent 45%),
                radial-gradient(circle at 90% 10%, rgba(0, 210, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 50% 80%, rgba(0, 40, 112, 0.4) 0%, transparent 50%);
            filter: blur(60px);
            animation: bgMotion 25s ease-in-out infinite alternate;
        }
        @keyframes bgMotion {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(2%, -3%) scale(1.03); }
            100% { transform: translate(-2%, 3%) scale(0.98); }
        }

        /* HEADER NAVBAR */
        header {
            position: sticky; top: 0; z-index: 1000;
            background: rgba(2, 6, 23, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            padding: 12px 24px;
            display: flex; align-items: center; justify-content: space-between;
        }

        .header-left { display: flex; align-items: center; gap: 16px; }

        .hamburger-btn {
            width: 42px; height: 42px;
            background: rgba(0, 40, 112, 0.85);
            border: 1px solid var(--glass-border);
            border-radius: 8px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 18px; transition: all 0.3s;
            z-index: 1002;
            position: relative;
        }
        .hamburger-btn:hover { background: var(--neon-blue); color: var(--primary-blue); }

        .brand-logo-btn {
            background: #fff; padding: 6px 14px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            height: 42px; border: none; cursor: pointer;
        }
        .brand-logo-btn img { height: 26px; width: auto; object-fit: contain; }

        .header-right { display: flex; align-items: center; gap: 16px; }

        .currency-selector, .lang-selector {
            background: rgba(0, 40, 112, 0.6);
            border: 1px solid var(--glass-border);
            color: #fff; padding: 8px 12px; border-radius: 8px;
            font-size: 13px; font-weight: 600; cursor: pointer; outline: none;
        }
        .currency-selector option, .lang-selector option { background: var(--dark-bg); color: #fff; }

        .cart-trigger-btn {
            position: relative;
            background: linear-gradient(135deg, var(--primary-blue), #0040b0);
            border: 1px solid rgba(0, 210, 255, 0.3);
            color: #fff; padding: 8px 18px; border-radius: 30px;
            font-size: 13px; font-weight: 700; cursor: pointer;
            display: flex; align-items: center; gap: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: all 0.3s;
        }
        .cart-trigger-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,210,255,0.3); }

        .cart-badge {
            background: var(--neon-blue); color: var(--primary-blue);
            font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 20px;
        }

        /* SIDEBAR OVERLAY & NAVIGATION */
        .sidebar-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 6, 23, 0.6); backdrop-filter: blur(4px);
            z-index: 1000; opacity: 0; visibility: hidden; transition: all 0.3s;
        }
        .sidebar-overlay.active { opacity: 1; visibility: visible; }

        .sidebar-nav {
            position: fixed; left: -340px; top: 0; height: 100vh; width: 320px;
            background: var(--glass-bg); border-right: 1px solid var(--glass-border);
            z-index: 1001; padding: 80px 20px 30px 20px;
            display: flex; flex-direction: column; gap: 15px;
            backdrop-filter: blur(25px); transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            overflow-y: auto;
        }
        .sidebar-nav.open { left: 0; }

        .sidebar-title {
            font-size: 11px; text-transform: uppercase; letter-spacing: 2px;
            color: var(--neon-blue); font-weight: 700; border-bottom: 1px solid var(--glass-border);
            padding-bottom: 8px; margin-bottom: 10px;
        }

        .nav-tree-item { margin-bottom: 8px; }
        .nav-tree-header {
            padding: 10px 12px; background: rgba(255, 255, 255, 0.04);
            border-radius: 6px; font-size: 13px; font-weight: 600;
            display: flex; align-items: center; justify-content: space-between;
            cursor: pointer; transition: all 0.2s;
        }
        .nav-tree-header:hover { background: rgba(255, 255, 255, 0.1); }
        .nav-tree-children { padding-left: 15px; display: none; margin-top: 5px; }
        .nav-tree-children.active { display: block; }

        .sub-link {
            padding: 8px 10px; font-size: 12px; color: #cbd5e1;
            display: block; cursor: pointer; border-radius: 4px; transition: all 0.2s;
        }
        .sub-link:hover, .sub-link.active { color: var(--neon-blue); background: rgba(0, 210, 255, 0.1); }

        /* MAIN CONTENT AREA */
        main { flex: 1; padding: 24px; max-width: 1600px; margin: 0 auto; width: 100%; }

        /* FILTER & SEARCH BAR */
        .filter-bar {
            background: rgba(0, 40, 112, 0.3); border: 1px solid var(--glass-border);
            backdrop-filter: blur(15px); border-radius: 12px; padding: 16px 20px;
            margin-bottom: 24px; display: flex; flex-wrap: wrap; gap: 16px;
            align-items: center; justify-content: space-between;
        }

        .search-input-box { position: relative; flex: 1; min-width: 280px; }
        .search-input-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #94a3b8; }
        .search-input-box input {
            width: 100%; background: rgba(2, 6, 23, 0.6); border: 1px solid var(--glass-border);
            padding: 10px 14px 10px 40px; border-radius: 8px; color: #fff; font-size: 13px; outline: none;
        }
        .search-input-box input:focus { border-color: var(--neon-blue); }

        .quick-filters { display: flex; gap: 10px; flex-wrap: wrap; }
        .filter-chip {
            padding: 6px 14px; background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border); border-radius: 20px;
            font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s;
        }
        .filter-chip:hover, .filter-chip.active { background: var(--neon-blue); color: var(--primary-blue); }

        /* PRODUCT GRID */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 14px; overflow: hidden;
            display: flex; flex-direction: column;
            transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        .product-card:hover {
            transform: translateY(-5px);
            border-color: var(--neon-blue);
            box-shadow: 0 10px 25px rgba(0, 210, 255, 0.15);
        }

        .card-img-wrap {
            position: relative; width: 100%; height: 210px;
            background: #000; overflow: hidden; display: flex;
            align-items: center; justify-content: center;
        }
        .card-img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s; }
        .product-card:hover .card-img-wrap img { transform: scale(1.05); }

        .card-badge {
            position: absolute; top: 10px; right: 10px;
            background: rgba(0, 40, 112, 0.85); color: var(--neon-blue);
            font-size: 10px; font-weight: 700; padding: 4px 8px; border-radius: 4px;
            backdrop-filter: blur(5px); border: 1px solid var(--glass-border);
        }

        .card-body { padding: 16px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .card-brand { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: #94a3b8; font-weight: 700; }
        .card-title { font-size: 16px; font-weight: 700; margin: 4px 0 8px 0; color: #fff; }
        .card-meta { font-size: 12px; color: #cbd5e1; margin-bottom: 12px; }

        .card-footer {
            display: flex; align-items: center; justify-content: space-between;
            border-top: 1px solid var(--glass-border); padding-top: 12px; margin-top: 8px;
        }
        .card-price { font-size: 15px; font-weight: 800; color: var(--neon-blue); }
        .view-btn {
            background: #fff; color: var(--primary-blue); border: none;
            padding: 8px 14px; border-radius: 6px; font-size: 12px; font-weight: 700;
            cursor: pointer; transition: all 0.2s;
        }
        .view-btn:hover { background: var(--neon-blue); }

        /* PRODUCT DETAIL MODAL */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 6, 23, 0.9); backdrop-filter: blur(20px);
            z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-overlay.active { display: flex; }

        .modal-card {
            background: #020617; border: 1px solid var(--glass-border);
            border-radius: 16px; width: 100%; max-width: 900px;
            max-height: 90vh; overflow-y: auto; display: flex; flex-wrap: wrap;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8); position: relative;
        }

        .modal-close {
            position: absolute; top: 16px; right: 16px; width: 36px; height: 36px;
            background: rgba(255,255,255,0.1); border-radius: 50%; border: none;
            color: #fff; font-size: 16px; cursor: pointer; z-index: 10; display: flex; align-items: center; justify-content: center;
        }
        .modal-close:hover { background: #ef4444; }

        .modal-left { flex: 1; min-width: 320px; background: #000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .modal-left img { max-width: 100%; max-height: 380px; object-fit: contain; }

        .modal-right { flex: 1.2; min-width: 340px; padding: 28px; display: flex; flex-direction: column; justify-content: space-between; }
        .modal-header h2 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
        .modal-subtitle { font-size: 12px; color: var(--neon-blue); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; }

        .variant-box {
            background: rgba(0, 40, 112, 0.3); border: 1px solid var(--glass-border);
            border-radius: 10px; padding: 16px; margin-bottom: 20px;
        }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; margin-bottom: 6px; font-weight: 700; }
        .form-group select {
            width: 100%; background: #020617; border: 1px solid var(--glass-border);
            color: #fff; padding: 10px; border-radius: 6px; font-size: 13px; font-weight: 600; outline: none;
        }

        .specs-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
        .spec-item { background: rgba(255,255,255,0.03); padding: 8px; border-radius: 6px; text-align: center; }
        .spec-item span { display: block; font-size: 10px; color: #94a3b8; text-transform: uppercase; }
        .spec-item strong { font-size: 12px; color: #fff; }

        .qty-row { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .qty-picker { display: flex; align-items: center; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 6px; }
        .qty-btn { width: 36px; height: 36px; background: none; border: none; color: #fff; font-size: 16px; cursor: pointer; }
        .qty-input { width: 50px; text-align: center; background: none; border: none; color: #fff; font-weight: 700; font-size: 14px; }

        .total-price-tag { font-size: 22px; font-weight: 800; color: var(--neon-blue); }

        .add-cart-btn {
            width: 100%; background: linear-gradient(135deg, var(--neon-blue), #0099ff);
            color: var(--primary-blue); border: none; padding: 14px; border-radius: 8px;
            font-size: 14px; font-weight: 800; cursor: pointer; transition: all 0.3s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .add-cart-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0, 210, 255, 0.3); }

        /* CART DRAWER */
        .cart-drawer {
            position: fixed; right: -420px; top: 0; height: 100vh; width: 400px;
            background: #020617; border-left: 1px solid var(--glass-border);
            z-index: 2001; padding: 24px; display: flex; flex-direction: column;
            backdrop-filter: blur(25px); transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .cart-drawer.open { right: 0; }

        .cart-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--glass-border); padding-bottom: 15px; }
        .cart-items-list { flex: 1; overflow-y: auto; padding: 15px 0; display: flex; flex-direction: column; gap: 12px; }

        .cart-item-card {
            background: rgba(0, 40, 112, 0.25); border: 1px solid var(--glass-border);
            border-radius: 8px; padding: 10px; display: flex; gap: 12px; align-items: center;
        }
        .cart-item-card img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; }
        .cart-item-info { flex: 1; }
        .cart-item-info h4 { font-size: 13px; font-weight: 700; margin-bottom: 2px; }
        .cart-item-info p { font-size: 11px; color: #94a3b8; }

        /* LOGISTICS METER STYLES */
        .logistics-bar-container {
            background: rgba(0, 40, 112, 0.35); border-radius: 12px; padding: 14px; margin: 12px 0;
            border: 1px solid var(--glass-border);
        }
        .logistics-title { font-size: 11px; font-weight: 700; color: var(--neon-blue); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
        .logistics-row { margin-bottom: 10px; }
        .logistics-label { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 4px; color: #cbd5e1; }
        .progress-track { width: 100%; height: 7px; background: rgba(0,0,0,0.5); border-radius: 4px; overflow: hidden; }
        .progress-fill-hq { height: 100%; background: linear-gradient(90deg, var(--neon-blue), #0099ff); width: 0%; transition: width 0.3s; }
        .progress-fill-truck { height: 100%; background: linear-gradient(90deg, var(--accent-gold), #f59e0b); width: 0%; transition: width 0.3s; }

        .cart-footer { border-top: 1px solid var(--glass-border); padding-top: 15px; }
        .export-excel-btn {
            width: 100%; background: #10b981; color: #fff; border: none;
            padding: 12px; border-radius: 8px; font-size: 13px; font-weight: 700;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s;
        }
        .export-excel-btn:hover { background: #059669; }

        @media (max-width: 768px) {
            .cart-drawer { width: 100%; right: -100%; }
            .modal-card { flex-direction: column; }
            .modal-left { height: 200px; }
        }
    </style>
</head>
<body>

    <div class="premium-bg"></div>

    <!-- HEADER NAVIGATION -->
    <header>
        <div class="header-left">
            <button class="hamburger-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars" id="hamburgerIcon"></i></button>
            <button class="brand-logo-btn">
                <img src="yatas_grup_logo.jpg" alt="Yataş Group" onerror="this.src='https://yatasinternational.github.io/Products-Photos/yatas_logo.png'">
            </button>
        </div>

        <div class="header-right">
            <select class="currency-selector" id="currencySelect" onchange="changeCurrency(this.value)">
                <option value="USD">USD ($)</option>
                <option value="EUR">EUR (€)</option>
            </select>

            <select class="lang-selector" id="langSelect" onchange="changeLanguage(this.value)">
                <option value="TR">TR</option>
                <option value="EN" selected>EN</option>
                <option value="DE">DE</option>
                <option value="RU">RU</option>
            </select>

            <button class="cart-trigger-btn" onclick="toggleCart()">
                <i class="fa-solid fa-cart-shopping"></i>
                <span data-i18n="cart">Cart</span>
                <span class="cart-badge" id="cartBadge">0</span>
            </button>
        </div>
    </header>

    <!-- SIDEBAR OVERLAY & DRAWER -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <div class="sidebar-nav" id="sidebarNav">
        <div class="sidebar-title" data-i18n="categories">Categories</div>
        <div id="navigationTree"></div>
    </div>

    <!-- MAIN CONTENT AREA -->
    <main>
        <!-- SEARCH & FILTER BAR -->
        <div class="filter-bar">
            <div class="search-input-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Search product family or description..." oninput="applyFilters()" data-i18n-ph="search_placeholder">
            </div>

            <div class="quick-filters" id="brandFilterChips">
                <div class="filter-chip active" onclick="filterByBrand('ALL')" data-i18n="all_brands">All Brands</div>
            </div>
        </div>

        <!-- PRODUCT GRID -->
        <div class="product-grid" id="productGrid"></div>
    </main>

    <!-- PRODUCT DETAIL MODAL -->
    <div class="modal-overlay" id="productModal">
        <div class="modal-card">
            <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            <div class="modal-left">
                <img id="modalImg" src="" alt="Product Image">
            </div>
            <div class="modal-right">
                <div class="modal-header">
                    <div class="modal-subtitle" id="modalBrandCategory">Yataş Bedding | Yatak</div>
                    <h2 id="modalFamilyTitle">Activio</h2>
                </div>

                <div class="variant-box">
                    <div class="form-group">
                        <label data-i18n="select_size">SELECT DIMENSION / SIZE</label>
                        <select id="sizeSelect" onchange="onSizeChange()"></select>
                    </div>

                    <div class="specs-grid">
                        <div class="spec-item">
                            <span data-i18n="gtip">HS CODE</span>
                            <strong id="specGtip">-</strong>
                        </div>
                        <div class="spec-item">
                            <span data-i18n="volume">VOLUME</span>
                            <strong id="specVolume">0 m³</strong>
                        </div>
                        <div class="spec-item">
                            <span data-i18n="weight">WEIGHT</span>
                            <strong id="specWeight">0 kg</strong>
                        </div>
                    </div>
                </div>

                <div>
                    <div class="qty-row">
                        <div class="qty-picker">
                            <button class="qty-btn" onclick="updateModalQty(-1)">-</button>
                            <input type="text" class="qty-input" id="modalQty" value="1" readonly>
                            <button class="qty-btn" onclick="updateModalQty(1)">+</button>
                        </div>
                        <div class="total-price-tag" id="modalTotalPrice">$0</div>
                    </div>

                    <button class="add-cart-btn" onclick="addCurrentToCart()">
                        <i class="fa-solid fa-cart-plus"></i> <span data-i18n="add_to_cart">Add to Proforma Order</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- CART & PROFORMA DRAWER -->
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-header">
            <h3 data-i18n="cart_title"><i class="fa-solid fa-file-invoice-dollar"></i> Proforma Order Summary</h3>
            <button class="modal-close" onclick="toggleCart()" style="position:static;"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="cart-items-list" id="cartItemsList"></div>

        <!-- DUAL LOGISTICS CALCULATOR (40' HQ & 70m3 TRUCK) -->
        <div class="logistics-bar-container">
            <div class="logistics-title">
                <i class="fa-solid fa-truck-ramp-box"></i> <span data-i18n="logistics_calc">LOGISTICS & VEHICLE CAPACITY</span>
            </div>

            <!-- 40' HQ CONTAINER -->
            <div class="logistics-row">
                <div class="logistics-label">
                    <span><i class="fa-solid fa-ship"></i> 40' HQ Container (68 m³)</span>
                    <strong id="hqCountText">0 Cont. (%0)</strong>
                </div>
                <div class="progress-track">
                    <div class="progress-fill-hq" id="hqProgressFill"></div>
                </div>
            </div>

            <!-- 70 m³ TRUCK -->
            <div class="logistics-row">
                <div class="logistics-label">
                    <span><i class="fa-solid fa-truck-front"></i> Standard Truck (70 m³)</span>
                    <strong id="truckCountText">0 Truck (%0)</strong>
                </div>
                <div class="progress-track">
                    <div class="progress-fill-truck" id="truckProgressFill"></div>
                </div>
            </div>

            <div style="font-size:10px; color:#94a3b8; border-top: 1px dashed var(--glass-border); padding-top: 6px;" id="logisticsMeta">
                Total Vol: 0.00 m³ | Total Wt: 0.0 kg
            </div>
        </div>

        <div class="cart-footer">
            <div style="display:flex; justify-content:space-between; font-weight:800; font-size:16px; margin-bottom:15px;">
                <span data-i18n="grand_total">Grand Total:</span>
                <span id="cartGrandTotal" style="color:var(--neon-blue);">$0</span>
            </div>

            <button class="export-excel-btn" onclick="exportProformaExcel()">
                <i class="fa-solid fa-file-excel"></i> <span data-i18n="export_excel">Export Excel Order with Photos</span>
            </button>
        </div>
    </div>

    <script>
        // UI DICTIONARY
        const i18n = {
            TR: {
                cart: "Sepet", categories: "Kategoriler", all_brands: "Tüm Markalar",
                search_placeholder: "Ürün ailesi veya malzeme tanımı arayın...",
                select_size: "ÖLÇÜ / EBAT SEÇİNİZ", gtip: "GTİP KODU", volume: "BİRİM HACİM", weight: "BİRİM AĞIRLIK",
                add_to_cart: "Siparişe Ekle", cart_title: "Proforma Sipariş Özeti",
                logistics_calc: "LOJİSTİK KAPASİTE VE ARAÇ HESABI", grand_total: "Genel Toplam:",
                export_excel: "Fotoğraflı Excel Sipariş Listesi İndir", from: "başlayan fiyatlar"
            },
            EN: {
                cart: "Cart", categories: "Categories", all_brands: "All Brands",
                search_placeholder: "Search product family or description...",
                select_size: "SELECT DIMENSION / SIZE", gtip: "HS CODE", volume: "UNIT VOL", weight: "UNIT WT",
                add_to_cart: "Add to Proforma Order", cart_title: "Proforma Order Summary",
                logistics_calc: "LOGISTICS & VEHICLE CAPACITY", grand_total: "Grand Total:",
                export_excel: "Export Excel Order with Photos", from: "from"
            },
            DE: {
                cart: "Warenkorb", categories: "Kategorien", all_brands: "Alle Marken",
                search_placeholder: "Produktfamilie oder Beschreibung suchen...",
                select_size: "GRÖSSE WÄHLEN", gtip: "HS CODE", volume: "VOLUMEN", weight: "GEWICHT",
                add_to_cart: "In die Proforma-Bestellung", cart_title: "Proforma-Bestellübersicht",
                logistics_calc: "LOGISTIK- UND FAHRZEUGKAPAZITÄT", grand_total: "Gesamtsumme:",
                export_excel: "Excel-Bestellung mit Fotos exportieren", from: "ab"
            },
            RU: {
                cart: "Корзина", categories: "Категории", all_brands: "Все бренды",
                search_placeholder: "Поиск семейства продуктов...",
                select_size: "ВЫБЕРИТЕ РАЗМЕР", gtip: "ТН ВЭД", volume: "ОБЪЕМ", weight: "ВЕС",
                add_to_cart: "Добавить в заказ", cart_title: "Сводка Проформа-Заказа",
                logistics_calc: "ЛОГИСТИКА И ЕМКОСТЬ ТRANSPORTA", grand_total: "Итого:",
                export_excel: "Скачать Excel с фото", from: "от"
            }
        };

        // AUTOMATIC WORD & CATEGORY TRANSLATION DICTIONARY
        const termTranslations = {
            "Yatak": { EN: "Mattress", DE: "Matratze", RU: "Матрас" },
            "Baza": { EN: "Base / Boxspring", DE: "Bettkasten", RU: "Основание" },
            "Başlık": { EN: "Headboard", DE: "Kopfteil", RU: "Изголовье" },
            "Yastık": { EN: "Pillow", DE: "Kissen", RU: "Подушка" },
            "Yorgan": { EN: "Duvet", DE: "Bettdecke", RU: "Одеяло" },
            "Alez": { EN: "Mattress Protector", DE: "Matratzenschoner", RU: "Наматрасник" },
            "Set": { EN: "Bed Set", DE: "Bett-Set", RU: "Комплект" },
            "Sünger Yatak": { EN: "Foam Mattress", DE: "Schaumstoffmatratze", RU: "Поролоновый матрас" },
            "Yaylı Yatak": { EN: "Spring Mattress", DE: "Federkernmatratze", RU: "Пружинный матрас" },
            "Bebek Yatağı": { EN: "Baby Mattress", DE: "Babymatratze", RU: "Детский матрас" },
            "Visco Yatak": { EN: "Visco Mattress", DE: "Visco-Matratze", RU: "Матрас Visco" },
            "Mobilya": { EN: "Furniture", DE: "Möbel", RU: "Мебель" },
            "Tekstil": { EN: "Textile", DE: "Textilien", RU: "Текстиль" },
            "Ev Tekstili": { EN: "Home Textile", DE: "Heimtextilien", RU: "Домашний текстиль" },
            "Genel": { EN: "General", DE: "Allgemein", RU: "Общие" }
        };

        function autoTranslateText(text, targetLang) {
            if (!text || targetLang === 'TR') return text;

            let translated = text;
            for (const [trTerm, langMap] of Object.entries(termTranslations)) {
                if (langMap[targetLang]) {
                    const regex = new RegExp(`\\b${trTerm}\\b`, 'gi');
                    translated = translated.replace(regex, langMap[targetLang]);
                }
            }
            return translated;
        }

        let currentLang = 'EN';
        let currentCurrency = 'USD';
        let rawProducts = [];
        let productFamilies = {};
        let activeBrandFilter = 'ALL';
        let activeCategoryFilter = null;
        let activeFamilyFilter = null;
        let cart = [];

        let currentActiveFamily = null;
        let currentSelectedVariant = null;

        window.addEventListener('DOMContentLoaded', async () => {
            await loadExcelData();
        });

        async function loadExcelData() {
            try {
                // Hem tr.xlsx hem de tr_yeni.xlsx için geriye dönük uyumluluk kontrolü
                let response = await fetch('tr.xlsx');
                if (!response.ok) {
                    response = await fetch('tr_yeni.xlsx');
                }
                const arrayBuffer = await response.arrayBuffer();
                const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                rawProducts = XLSX.utils.sheet_to_json(firstSheet);
                
                processRawData();
                buildBrandChips();
                buildNavigationTree();
                renderProductGrid();
            } catch (err) {
                console.error("Excel dosyası okunamadı:", err);
            }
        }

        function processRawData() {
            productFamilies = {};
            rawProducts.forEach(item => {
                const familyName = item['Ürün Ailesi'] || item['Malzeme Tanım'] || 'Diğer';
                const descText = item['Malzeme Tanım'] || item['Ürün Ailesi'] + ' ' + (item['Ölçü'] || '');
                
                if (!productFamilies[familyName]) {
                    productFamilies[familyName] = {
                        familyName: familyName,
                        brand: item['Marka'] || 'Yataş Group',
                        category: item['Kategori'] || 'Genel',
                        productType: item['Ürün Tipi'] || 'Genel',
                        photoUrl: item['Foto weblink'] || '',
                        variants: []
                    };
                }
                productFamilies[familyName].variants.push({
                    code: item['Ürün Kodu'],
                    size: item['Ölçü'] || '-',
                    desc: descText,
                    usdPrice: parseFloat(item['Birim USD Fiyat']) || 0,
                    eurPrice: parseFloat(item['Birim EUR Fiyat']) || 0,
                    height: item['Yükseklik CM'] || 0,
                    barcode: item['Barkod'],
                    gtip: item['GTIP'] || '-',
                    volume: parseFloat(item['Birim Hacim M3']) || 0,
                    weight: parseFloat(item['Birim Ağırlık KG']) || 0
                });
            });
        }

        function buildBrandChips() {
            const brands = ['ALL', ...new Set(rawProducts.map(i => i['Marka']).filter(Boolean))];
            const chipContainer = document.getElementById('brandFilterChips');
            chipContainer.innerHTML = brands.map(b => `
                <div class="filter-chip ${b === activeBrandFilter ? 'active' : ''}" onclick="filterByBrand('${b}')">
                    ${b === 'ALL' ? i18n[currentLang].all_brands : b}
                </div>
            `).join('');
        }

        function buildNavigationTree() {
            const tree = {};
            rawProducts.forEach(i => {
                const b = i['Marka'] || 'Yataş';
                const c = i['Kategori'] || 'Genel';
                const fam = i['Ürün Ailesi'] || i['Malzeme Tanım'] || 'Diğer';
                
                if (!tree[b]) tree[b] = {};
                if (!tree[b][c]) tree[b][c] = new Set();
                tree[b][c].add(fam);
            });

            const navContainer = document.getElementById('navigationTree');
            let html = '';
            for (const [brand, categories] of Object.entries(tree)) {
                html += `<div class="nav-tree-item">
                    <div class="nav-tree-header" onclick="toggleNavAccordion(this)">
                        <span><i class="fa-solid fa-layer-group"></i> ${brand}</span>
                        <i class="fa-solid fa-chevron-down"></i>
                    </div>
                    <div class="nav-tree-children">`;
                for (const [cat, families] of Object.entries(categories)) {
                    const translatedCat = autoTranslateText(cat, currentLang);
                    html += `<div style="margin: 4px 0;">
                        <span class="sub-link" style="font-weight:700; color:var(--neon-blue);" onclick="filterByCategory('${brand}', '${cat}')">📂 ${translatedCat}</span>`;
                    
                    Array.from(families).slice(0, 20).forEach(fam => {
                        html += `<span class="sub-link" style="padding-left:18px;" onclick="filterByFamily('${brand}', '${cat}', '${fam}')">• ${fam}</span>`;
                    });
                    html += `</div>`;
                }
                html += `</div></div>`;
            }
            navContainer.innerHTML = html;
        }

        function toggleNavAccordion(el) { el.nextElementSibling.classList.toggle('active'); }

        async function renderProductGrid() {
            const grid = document.getElementById('productGrid');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();

            let families = Object.values(productFamilies);

            families = families.filter(f => {
                const matchBrand = (activeBrandFilter === 'ALL' || f.brand === activeBrandFilter);
                const matchCat = (!activeCategoryFilter || f.category === activeCategoryFilter);
                const matchFam = (!activeFamilyFilter || f.familyName === activeFamilyFilter);
                const matchSearch = (f.familyName.toLowerCase().includes(searchVal) || f.variants.some(v => v.desc.toLowerCase().includes(searchVal)));
                return matchBrand && matchCat && matchFam && matchSearch;
            });

            grid.innerHTML = families.map(f => {
                const minPrice = Math.min(...f.variants.map(v => currentCurrency === 'USD' ? v.usdPrice : v.eurPrice));
                const currencySymbol = currentCurrency === 'USD' ? '$' : '€';
                const translatedCat = autoTranslateText(f.category, currentLang);
                const translatedType = autoTranslateText(f.productType, currentLang);
                const fromLabel = i18n[currentLang].from || 'from';

                return `
                <div class="product-card">
                    <div class="card-img-wrap">
                        <img src="${f.photoUrl}" alt="${f.familyName}" onerror="this.src='https://via.placeholder.com/300x200?text=Yatas+Bedding'">
                        <div class="card-badge">${f.variants.length} Sizes</div>
                    </div>
                    <div class="card-body">
                        <div>
                            <div class="card-brand">${f.brand} | ${translatedCat}</div>
                            <h3 class="card-title">${f.familyName}</h3>
                            <div class="card-meta">${translatedType}</div>
                        </div>
                        <div class="card-footer">
                            <div class="card-price">${fromLabel} ${currencySymbol}${minPrice}</div>
                            <button class="view-btn" onclick="openProductModal('${f.familyName}')">Configure</button>
                        </div>
                    </div>
                </div>
            `}).join('');
        }

        function openProductModal(familyName) {
            currentActiveFamily = productFamilies[familyName];
            const translatedCat = autoTranslateText(currentActiveFamily.category, currentLang);
            const translatedType = autoTranslateText(currentActiveFamily.productType, currentLang);

            document.getElementById('modalFamilyTitle').innerText = currentActiveFamily.familyName;
            document.getElementById('modalBrandCategory').innerText = `${currentActiveFamily.brand} | ${translatedCat} (${translatedType})`;
            document.getElementById('modalImg').src = currentActiveFamily.photoUrl;

            const sizeSelect = document.getElementById('sizeSelect');
            sizeSelect.innerHTML = currentActiveFamily.variants.map((v, idx) => {
                const translatedDesc = autoTranslateText(v.desc, currentLang);
                return `<option value="${idx}">${v.size} - ${translatedDesc}</option>`;
            }).join('');

            document.getElementById('modalQty').value = 1;
            onSizeChange();
            document.getElementById('productModal').classList.add('active');
        }

        function onSizeChange() {
            const idx = document.getElementById('sizeSelect').value;
            currentSelectedVariant = currentActiveFamily.variants[idx];

            document.getElementById('specGtip').innerText = currentSelectedVariant.gtip;
            document.getElementById('specVolume').innerText = `${currentSelectedVariant.volume} m³`;
            document.getElementById('specWeight').innerText = `${currentSelectedVariant.weight} kg`;

            updateModalPrice();
        }

        function updateModalQty(delta) {
            const qtyInput = document.getElementById('modalQty');
            let val = parseInt(qtyInput.value) + delta;
            if (val < 1) val = 1;
            qtyInput.value = val;
            updateModalPrice();
        }

        function updateModalPrice() {
            const qty = parseInt(document.getElementById('modalQty').value);
            const unitPrice = currentCurrency === 'USD' ? currentSelectedVariant.usdPrice : currentSelectedVariant.eurPrice;
            const symbol = currentCurrency === 'USD' ? '$' : '€';
            document.getElementById('modalTotalPrice').innerText = `${symbol}${(unitPrice * qty).toFixed(2)}`;
        }

        function closeModal() { document.getElementById('productModal').classList.remove('active'); }

        function addCurrentToCart() {
            const qty = parseInt(document.getElementById('modalQty').value);
            const unitPrice = currentCurrency === 'USD' ? currentSelectedVariant.usdPrice : currentSelectedVariant.eurPrice;

            const existingIndex = cart.findIndex(i => i.code === currentSelectedVariant.code && i.currency === currentCurrency);
            if (existingIndex > -1) {
                cart[existingIndex].qty += qty;
            } else {
                cart.push({
                    family: currentActiveFamily.familyName,
                    brand: currentActiveFamily.brand,
                    photoUrl: currentActiveFamily.photoUrl,
                    code: currentSelectedVariant.code,
                    size: currentSelectedVariant.size,
                    desc: currentSelectedVariant.desc,
                    gtip: currentSelectedVariant.gtip,
                    volume: currentSelectedVariant.volume,
                    weight: currentSelectedVariant.weight,
                    qty: qty,
                    unitPrice: unitPrice,
                    currency: currentCurrency
                });
            }

            closeModal();
            updateCartDisplay();
            toggleCart(true);
        }

        function updateCartDisplay() {
            document.getElementById('cartBadge').innerText = cart.reduce((acc, i) => acc + i.qty, 0);

            const list = document.getElementById('cartItemsList');
            let totalVal = 0;
            let totalM3 = 0;
            let totalKg = 0;

            list.innerHTML = cart.map((item, idx) => {
                const itemTotal = item.qty * item.unitPrice;
                totalVal += itemTotal;
                totalM3 += item.qty * item.volume;
                totalKg += item.qty * item.weight;
                const symbol = item.currency === 'USD' ? '$' : '€';

                return `
                <div class="cart-item-card">
                    <img src="${item.photoUrl}" onerror="this.src='https://via.placeholder.com/50'">
                    <div class="cart-item-info">
                        <h4>${item.family} (${item.size})</h4>
                        <p>${item.qty} x ${symbol}${item.unitPrice} = <strong>${symbol}${itemTotal.toFixed(2)}</strong></p>
                    </div>
                    <button style="background:none; border:none; color:#ef4444; cursor:pointer;" onclick="removeFromCart(${idx})"><i class="fa-solid fa-trash"></i></button>
                </div>
            `}).join('');

            const mainSymbol = currentCurrency === 'USD' ? '$' : '€';
            document.getElementById('cartGrandTotal').innerText = `${mainSymbol}${totalVal.toFixed(2)}`;

            calculateLogistics(totalM3, totalKg);
        }

        function calculateLogistics(totalM3, totalKg) {
            const HQ_CAPACITY = 68.0;
            const TRUCK_CAPACITY = 70.0;

            const hqExact = totalM3 / HQ_CAPACITY;
            const hqFull = Math.floor(hqExact);
            const hqRemainderPercent = Math.round((hqExact - hqFull) * 100);
            const totalHq = totalM3 > 0 ? Math.ceil(hqExact) : 0;

            const truckExact = totalM3 / TRUCK_CAPACITY;
            const truckFull = Math.floor(truckExact);
            const truckRemainderPercent = Math.round((truckExact - truckFull) * 100);
            const totalTrucks = totalM3 > 0 ? Math.ceil(truckExact) : 0;

            if (totalHq === 0) {
                document.getElementById('hqCountText').innerText = "0 Cont. (%0)";
                document.getElementById('hqProgressFill').style.width = "0%";
            } else if (hqFull === 0) {
                document.getElementById('hqCountText').innerText = `1 Cont. (%${hqRemainderPercent} full)`;
                document.getElementById('hqProgressFill').style.width = `${hqRemainderPercent}%`;
            } else {
                document.getElementById('hqCountText').innerText = `${hqFull} Full + 1 Cont. (%${hqRemainderPercent} full) [Total: ${totalHq}]`;
                document.getElementById('hqProgressFill').style.width = `${hqRemainderPercent}%`;
            }

            if (totalTrucks === 0) {
                document.getElementById('truckCountText').innerText = "0 Truck (%0)";
                document.getElementById('truckProgressFill').style.width = "0%";
            } else if (truckFull === 0) {
                document.getElementById('truckCountText').innerText = `1 Truck (%${truckRemainderPercent} full)`;
                document.getElementById('truckProgressFill').style.width = `${truckRemainderPercent}%`;
            } else {
                document.getElementById('truckCountText').innerText = `${truckFull} Full + 1 Truck (%${truckRemainderPercent} full) [Total: ${totalTrucks}]`;
                document.getElementById('truckProgressFill').style.width = `${truckRemainderPercent}%`;
            }

            document.getElementById('logisticsMeta').innerText = `Total Vol: ${totalM3.toFixed(2)} m³ | Total Wt: ${totalKg.toFixed(1)} kg`;
        }

        function removeFromCart(idx) { cart.splice(idx, 1); updateCartDisplay(); }
        function toggleCart(forceOpen) {
            const drawer = document.getElementById('cartDrawer');
            if (forceOpen) drawer.classList.add('open');
            else drawer.classList.toggle('open');
        }

        function toggleSidebar() {
            const nav = document.getElementById('sidebarNav');
            const overlay = document.getElementById('sidebarOverlay');
            const icon = document.getElementById('hamburgerIcon');

            nav.classList.toggle('open');
            overlay.classList.toggle('active');

            if (nav.classList.contains('open')) {
                icon.className = "fa-solid fa-xmark";
            } else {
                icon.className = "fa-solid fa-bars";
            }
        }

        function filterByBrand(b) {
            activeBrandFilter = b;
            buildBrandChips();
            renderProductGrid();
        }

        function filterByCategory(brand, cat) {
            activeBrandFilter = brand;
            activeCategoryFilter = cat;
            activeFamilyFilter = null;
            renderProductGrid();
            toggleSidebar();
        }

        function filterByFamily(brand, cat, fam) {
            activeBrandFilter = brand;
            activeCategoryFilter = cat;
            activeFamilyFilter = fam;
            renderProductGrid();
            toggleSidebar();
        }

        function applyFilters() { renderProductGrid(); }

        function changeCurrency(curr) {
            currentCurrency = curr;
            renderProductGrid();
            updateCartDisplay();
        }

        function changeLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[lang][key]) el.innerText = i18n[lang][key];
            });
            document.querySelectorAll('[data-i18n-ph]').forEach(el => {
                const key = el.getAttribute('data-i18n-ph');
                if (i18n[lang][key]) el.placeholder = i18n[lang][key];
            });
            buildBrandChips();
            buildNavigationTree();
            renderProductGrid();
        }

        async function exportProformaExcel() {
            if (cart.length === 0) {
                alert("Sepetiniz boş / Cart is empty!");
                return;
            }

            const workbook = new ExcelJS.Workbook();
            const worksheet = workbook.addWorksheet('Proforma Order');

            worksheet.columns = [
                { header: 'Image', key: 'img', width: 15 },
                { header: 'Brand', key: 'brand', width: 18 },
                { header: 'Product Family', key: 'family', width: 22 },
                { header: 'Dimension / Size', key: 'size', width: 16 },
                { header: 'Product Code', key: 'code', width: 18 },
                { header: 'HS CODE (GTİP)', key: 'gtip', width: 16 },
                { header: 'Qty', key: 'qty', width: 10 },
                { header: 'Unit Price', key: 'unitPrice', width: 14 },
                { header: 'Total Price', key: 'totalPrice', width: 16 },
                { header: 'Total Vol (m³)', key: 'vol', width: 14 },
                { header: 'Total Wt (kg)', key: 'wt', width: 14 }
            ];

            worksheet.getRow(1).font = { bold: true, color: { argb: 'FFFFFF' }, size: 11 };
            worksheet.getRow(1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: '002870' } };

            for (let i = 0; i < cart.length; i++) {
                const item = cart[i];
                const row = worksheet.addRow({
                    brand: item.brand,
                    family: item.family,
                    size: item.size,
                    code: item.code,
                    gtip: item.gtip,
                    qty: item.qty,
                    unitPrice: `${item.unitPrice} ${item.currency}`,
                    totalPrice: `${(item.qty * item.unitPrice).toFixed(2)} ${item.currency}`,
                    vol: (item.qty * item.volume).toFixed(3),
                    wt: (item.qty * item.weight).toFixed(2)
                });

                row.height = 50;

                try {
                    const imgResponse = await fetch(item.photoUrl);
                    const imgBlob = await imgResponse.blob();
                    const arrayBuffer = await imgBlob.arrayBuffer();
                    
                    const imageId = workbook.addImage({
                        buffer: arrayBuffer,
                        extension: 'png',
                    });

                    worksheet.addImage(imageId, {
                        tl: { col: 0, row: row.number - 1 },
                        ext: { width: 60, height: 45 }
                    });
                } catch (e) {
                    console.warn("Resim Excel'e eklenemedi:", item.photoUrl);
                }
            }

            const buffer = await workbook.xlsx.writeBuffer();
            const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `Yatas_Proforma_Order_${new Date().toISOString().slice(0,10)}.xlsx`;
            link.click();
        }
    </script>
