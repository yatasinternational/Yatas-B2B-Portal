<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Yataş International Experience Portal</title>
    
    <!-- PWA Infrastructure -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#020617">

    <!-- Excel Export (xlsx) Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root {
            --primary-blue: #002870;
            --neon-blue: #00d2ff;
            --dark-card: #081028;
            --glass-bg: rgba(2, 6, 23, 0.88);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background: #020617;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 15px 30px;
            background: rgba(0, 40, 112, 0.4);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .brand-logo { height: 32px; filter: brightness(0) invert(1); }

        .cart-trigger-btn {
            background: var(--neon-blue);
            color: #002870;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
        }

        .container {
            padding: 40px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }

        /* PRODUCT CARD GRID */
        .grid-products {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: var(--dark-card);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-6px);
            border-color: var(--neon-blue);
            box-shadow: 0 12px 30px rgba(0, 210, 255, 0.15);
        }

        .card-img-wrapper {
            position: relative;
            width: 100%;
            height: 220px;
            background: #000;
        }

        .card-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge-sizes {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0, 40, 112, 0.85);
            color: var(--neon-blue);
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid var(--glass-border);
        }

        .card-body { padding: 20px; }

        .card-category {
            font-size: 11px;
            color: #8fa0c0;
            letter-spacing: 1.5px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .card-title {
            font-size: 22px;
            font-weight: 800;
            margin: 4px 0;
            color: #fff;
        }

        .card-status {
            font-size: 12px;
            color: var(--neon-blue);
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 15px;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.06);
            padding-top: 15px;
            margin-top: 10px;
        }

        .price-tag { font-size: 18px; font-weight: 800; color: var(--neon-blue); }

        .btn-configure {
            background: #ffffff;
            color: #002870;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13px;
            pointer-events: none; /* Kart tıklamasını engellemesin */
        }

        /* MODAL - PRODUCT CONFIGURATOR */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active { display: flex; }

        .modal-content {
            background: #040a1a;
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            width: 850px;
            max-width: 92vw;
            display: flex;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.7);
            position: relative;
        }

        .modal-left { flex: 1; background: #000; display: flex; align-items: center; }
        .modal-left img { width: 100%; height: 100%; object-fit: cover; }

        .modal-right {
            flex: 1.1;
            padding: 35px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .close-modal-btn {
            position: absolute;
            top: 15px; right: 15px;
            width: 32px; height: 32px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
        }

        .modal-category { font-size: 11px; color: var(--neon-blue); font-weight: 700; letter-spacing: 1px; }
        .modal-title { font-size: 28px; font-weight: 800; }

        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-label { font-size: 10px; font-weight: 700; color: #7e91b5; letter-spacing: 1px; }

        .select-input {
            width: 100%;
            background: #091533;
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            padding: 12px 15px;
            border-radius: 8px;
            font-weight: 700;
            outline: none;
            cursor: pointer;
        }

        /* 4-COLUMN INFO SPEC GRID */
        .specs-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 5px;
        }

        .spec-box {
            background: #091533;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 10px 6px;
            text-align: center;
        }

        .spec-box .lbl { font-size: 8px; color: #7e91b5; font-weight: 700; display: block; margin-bottom: 2px; }
        .spec-box .val { font-size: 11px; font-weight: 800; color: #fff; }

        .qty-price-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
        }

        .qty-picker {
            display: flex;
            align-items: center;
            background: #091533;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .qty-btn {
            width: 36px; height: 36px;
            background: transparent;
            border: none;
            color: #fff;
            font-weight: 800;
            cursor: pointer;
        }

        .qty-val { width: 30px; text-align: center; font-size: 14px; font-weight: 800; }

        .modal-price { font-size: 24px; font-weight: 800; color: var(--neon-blue); }

        .btn-add-order {
            background: var(--neon-blue);
            color: #002870;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0, 210, 255, 0.25);
        }

        /* DRAWER - PROFORMA ORDER SUMMARY */
        .drawer-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2500;
            display: none;
        }

        .drawer-overlay.active { display: block; }

        .cart-drawer {
            position: fixed;
            top: 0; right: -420px;
            width: 380px;
            height: 100vh;
            background: #040a1a;
            border-left: 1px solid var(--glass-border);
            z-index: 2600;
            padding: 25px;
            display: flex;
            flex-direction: column;
            transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .cart-drawer.active { right: 0; }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--glass-border);
        }

        .drawer-title { font-size: 18px; font-weight: 800; }

        .cart-items-list {
            flex: 1;
            overflow-y: auto;
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .cart-item-card {
            background: #091533;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            gap: 12px;
            align-items: center;
            position: relative;
        }

        .cart-item-img {
            width: 55px; height: 55px;
            border-radius: 6px;
            object-fit: cover;
            cursor: pointer;
        }

        .cart-item-info { flex: 1; cursor: pointer; }
        .cart-item-name { font-size: 13px; font-weight: 800; color: #fff; }
        .cart-item-size { font-size: 11px; color: #7e91b5; }
        .cart-item-price { font-size: 13px; font-weight: 800; color: var(--neon-blue); margin-top: 4px; }

        .cart-qty-ctrl {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0,0,0,0.3);
            border-radius: 6px;
            padding: 2px 6px;
            margin-top: 6px;
            width: fit-content;
        }

        .cart-qty-ctrl button {
            background: none; border: none; color: #fff; font-weight: 800; cursor: pointer; font-size: 12px;
        }

        .cart-qty-ctrl span { font-size: 11px; font-weight: 800; min-width: 14px; text-align: center; }

        .btn-remove-item {
            background: none; border: none; color: #ff4757; cursor: pointer; font-size: 14px; padding: 4px;
        }

        .drawer-footer {
            border-top: 1px solid var(--glass-border);
            padding-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .grand-total-row {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: 800;
        }

        .btn-export-excel {
            background: #10b981;
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
    </style>
</head>
<body>

    <header class="header">
        <h2 style="font-size: 18px; font-weight: 800; letter-spacing: 1px;">YATAŞ INTERNATIONAL</h2>
        <button class="cart-trigger-btn" onclick="toggleCartDrawer(true)">
            🛒 Proforma Summary (<span id="cartCount">0</span>)
        </button>
    </header>

    <main class="container">
        <div class="grid-products" id="productGrid"></div>
    </main>

    <!-- PRODUCT CONFIGURATOR MODAL -->
    <div class="modal-overlay" id="productModal">
        <div class="modal-content">
            <button class="close-modal-btn" onclick="closeModal()">✕</button>
            <div class="modal-left">
                <img id="modalImg" src="" alt="Product">
            </div>
            <div class="modal-right">
                <div>
                    <span class="modal-category">YATAŞ BEDDING | MATTRESS</span>
                    <h2 class="modal-title" id="modalTitle">Activio</h2>
                </div>

                <div class="form-group">
                    <label class="form-label">SELECT DIMENSION / SIZE</label>
                    <select class="select-input" id="sizeSelect" onchange="onSizeChange()"></select>
                </div>

                <div class="specs-grid">
                    <div class="spec-box">
                        <span class="lbl">HS CODE</span>
                        <span class="val" id="specHsCode">94042910</span>
                    </div>
                    <div class="spec-box">
                        <span class="lbl">UNIT VOL</span>
                        <span class="val" id="specVol">0.513 m³</span>
                    </div>
                    <div class="spec-box">
                        <span class="lbl">UNIT WT</span>
                        <span class="val" id="specWt">22.05 kg</span>
                    </div>
                    <div class="spec-box">
                        <span class="lbl">HEIGHT</span>
                        <span class="val" id="specHeight">31 cm</span>
                    </div>
                </div>

                <div class="qty-price-row">
                    <div class="qty-picker">
                        <button class="qty-btn" onclick="updateModalQty(-1)">-</button>
                        <span class="qty-val" id="modalQty">1</span>
                        <button class="qty-btn" onclick="updateModalQty(1)">+</button>
                    </div>
                    <div class="modal-price" id="modalPrice">$179.00</div>
                </div>

                <button class="btn-add-order" onclick="addToProforma()">🛒 Add to Proforma Order</button>
            </div>
        </div>
    </div>

    <!-- PROFORMA ORDER SUMMARY DRAWER -->
    <div class="drawer-overlay" id="drawerOverlay" onclick="toggleCartDrawer(false)"></div>
    <div class="cart-drawer" id="cartDrawer">
        <div class="drawer-header">
            <h3 class="drawer-title">Proforma Order Summary</h3>
            <button class="close-modal-btn" onclick="toggleCartDrawer(false)">✕</button>
        </div>

        <div class="cart-items-list" id="cartItemsList"></div>

        <div class="drawer-footer">
            <div class="grand-total-row">
                <span>Grand Total:</span>
                <span style="color: var(--neon-blue);" id="grandTotal">$0.00</span>
            </div>
            <button class="btn-export-excel" onclick="exportToExcel()">
                📊 Export Excel Order with Photos
            </button>
        </div>
    </div>

    <script>
        // TR DATA SOURCE (MTO/MTS & Yükseklik Entegreli)
        const productDatabase = {
            "Activio": {
                brand: "Yataş Bedding",
                category: "Yatak",
                family: "Activio",
                image: "input_file_0.png",
                sizes: [
                    { code: "50501003380001", size: "090X190", status: "MTO", price: 179, height: 31, hsCode: "940429100000", vol: "0.513", wt: "22.05", barcode: "8684177543298" },
                    { code: "50501003380002", size: "090X200", status: "MTO", price: 179, height: 31, hsCode: "940429100000", vol: "0.540", wt: "23.10", barcode: "8684177543304" },
                    { code: "50501003380003", size: "100X200", status: "MTS", price: 189, height: 31, hsCode: "940429100000", vol: "0.600", wt: "25.00", barcode: "8684177543311" },
                    { code: "50501003380004", size: "120X200", status: "MTS", price: 198, height: 31, hsCode: "940429100000", vol: "0.720", wt: "29.50", barcode: "8684177543328" },
                    { code: "50501003380005", size: "140X190", status: "MTS", price: 217, height: 31, hsCode: "940429100000", vol: "0.798", wt: "33.00", barcode: "8684177543335" },
                    { code: "50501003380006", size: "140X200", status: "MTO", price: 217, height: 31, hsCode: "940429100000", vol: "0.840", wt: "34.20", barcode: "8684177543342" },
                    { code: "50501003380007", size: "150X200", status: "MTS", price: 229, height: 31, hsCode: "940429100000", vol: "0.900", wt: "36.50", barcode: "8684177543359" },
                    { code: "50501003380008", size: "160X200", status: "MTS", price: 257, height: 31, hsCode: "940429100000", vol: "0.960", wt: "39.00", barcode: "8684177543366" }
                ]
            }
        };

        let currentActiveFamily = "Activio";
        let selectedSizeObj = null;
        let currentModalQty = 1;
        let cart = [];

        // INITIALIZE RENDER
        window.onload = () => {
            renderProductGrid();
        };

        function renderProductGrid() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';

            Object.keys(productDatabase).forEach(familyKey => {
                const prod = productDatabase[familyKey];
                const defaultSize = prod.sizes[0];

                const cardHtml = `
                    <div class="product-card" onclick="openConfigurator('${familyKey}')">
                        <div class="card-img-wrapper">
                            <img src="${prod.image}" alt="${familyKey}">
                            <span class="badge-sizes">${prod.sizes.length} Sizes</span>
                        </div>
                        <div class="card-body">
                            <span class="card-category">${prod.brand} | ${prod.category}</span>
                            <h3 class="card-title">${prod.family}</h3>
                            <div class="card-status">${defaultSize.status}</div>
                            <div class="card-footer">
                                <span class="price-tag">from $${defaultSize.price}</span>
                                <button class="btn-configure">Configure</button>
                            </div>
                        </div>
                    </div>
                `;
                grid.innerHTML += cardHtml;
            });
        }

        // CONFIGURATOR MODAL
        function openConfigurator(familyKey, targetSizeCode = null) {
            currentActiveFamily = familyKey;
            const prod = productDatabase[familyKey];
            
            document.getElementById('modalTitle').innerText = prod.family;
            document.getElementById('modalImg').src = prod.image;
            
            const sizeSelect = document.getElementById('sizeSelect');
            sizeSelect.innerHTML = '';

            prod.sizes.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.code;
                opt.innerText = s.size; // Sadece ebat yazısı (Yaylı / ürün adı yok)
                sizeSelect.appendChild(opt);
            });

            if (targetSizeCode) {
                sizeSelect.value = targetSizeCode;
            }

            currentModalQty = 1;
            document.getElementById('modalQty').innerText = currentModalQty;

            onSizeChange();
            document.getElementById('productModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('productModal').classList.remove('active');
        }

        function onSizeChange() {
            const code = document.getElementById('sizeSelect').value;
            const prod = productDatabase[currentActiveFamily];
            selectedSizeObj = prod.sizes.find(s => s.code === code);

            document.getElementById('specHsCode').innerText = selectedSizeObj.hsCode;
            document.getElementById('specVol').innerText = selectedSizeObj.vol + ' m³';
            document.getElementById('specWt').innerText = selectedSizeObj.wt + ' kg';
            document.getElementById('specHeight').innerText = selectedSizeObj.height + ' cm';
            document.getElementById('modalPrice').innerText = '$' + (selectedSizeObj.price * currentModalQty).toFixed(2);
        }

        function updateModalQty(delta) {
            if (currentModalQty + delta >= 1) {
                currentModalQty += delta;
                document.getElementById('modalQty').innerText = currentModalQty;
                document.getElementById('modalPrice').innerText = '$' + (selectedSizeObj.price * currentModalQty).toFixed(2);
            }
        }

        // ADD TO PROFORMA
        function addToProforma() {
            const existingIdx = cart.findIndex(i => i.code === selectedSizeObj.code);
            if (existingIdx > -1) {
                cart[existingIdx].qty += currentModalQty;
            } else {
                cart.push({
                    family: currentActiveFamily,
                    brand: productDatabase[currentActiveFamily].brand,
                    image: productDatabase[currentActiveFamily].image,
                    code: selectedSizeObj.code,
                    size: selectedSizeObj.size,
                    price: selectedSizeObj.price,
                    status: selectedSizeObj.status,
                    height: selectedSizeObj.height,
                    hsCode: selectedSizeObj.hsCode,
                    vol: selectedSizeObj.vol,
                    wt: selectedSizeObj.wt,
                    barcode: selectedSizeObj.barcode,
                    qty: currentModalQty
                });
            }

            closeModal();
            updateCartUI();
            toggleCartDrawer(true);
        }

        // DRAWER CONTROLS
        function toggleCartDrawer(open) {
            const drawer = document.getElementById('cartDrawer');
            const overlay = document.getElementById('drawerOverlay');
            if (open) {
                drawer.classList.add('active');
                overlay.classList.add('active');
            } else {
                drawer.classList.remove('active');
                overlay.classList.remove('active');
            }
        }

        function updateCartUI() {
            const list = document.getElementById('cartItemsList');
            list.innerHTML = '';
            let total = 0;
            let count = 0;

            cart.forEach((item, idx) => {
                const itemTotal = item.price * item.qty;
                total += itemTotal;
                count += item.qty;

                const itemHtml = `
                    <div class="cart-item-card">
                        <img src="${item.image}" class="cart-item-img" onclick="openConfigurator('${item.family}', '${item.code}')">
                        <div class="cart-item-info" onclick="openConfigurator('${item.family}', '${item.code}')">
                            <div class="cart-item-name">${item.family}</div>
                            <div class="cart-item-size">${item.size} (${item.status})</div>
                            <div class="cart-item-price">$${itemTotal.toFixed(2)}</div>
                        </div>
                        <div>
                            <button class="btn-remove-item" onclick="removeCartItem(${idx})">🗑</button>
                            <div class="cart-qty-ctrl">
                                <button onclick="changeCartQty(${idx}, -1)">-</button>
                                <span>${item.qty}</span>
                                <button onclick="changeCartQty(${idx}, 1)">+</button>
                            </div>
                        </div>
                    </div>
                `;
                list.innerHTML += itemHtml;
            });

            document.getElementById('cartCount').innerText = count;
            document.getElementById('grandTotal').innerText = '$' + total.toFixed(2);
        }

        function changeCartQty(idx, delta) {
            if (cart[idx].qty + delta > 0) {
                cart[idx].qty += delta;
            } else {
                cart.splice(idx, 1);
            }
            updateCartUI();
        }

        function removeCartItem(idx) {
            cart.splice(idx, 1);
            updateCartUI();
        }

        // EXPORT TO EXCEL
        function exportToExcel() {
            if (cart.length === 0) {
                alert("Proforma listeniz boş!");
                return;
            }

            const excelData = cart.map(item => ({
                "Brand": item.brand,
                "Product Family": item.family,
                "Dimension / Size": item.size,
                "Status": item.status,
                "Height (cm)": item.height,
                "Product Code": item.code,
                "Barcode": item.barcode,
                "HS CODE (GTİP)": item.hsCode,
                "Qty": item.qty,
                "Unit Price": item.price + " USD",
                "Total Price": (item.price * item.qty) + " USD",
                "Total Vol (m³)": (parseFloat(item.vol) * item.qty).toFixed(3),
                "Total Wt (kg)": (parseFloat(item.wt) * item.qty).toFixed(2)
            }));

            const worksheet = XLSX.utils.json_to_sheet(excelData);
            
            // Kolon genişlikleri
            worksheet['!cols'] = [
                { wch: 15 }, { wch: 15 }, { wch: 18 }, { wch: 10 },
                { wch: 12 }, { wch: 18 }, { wch: 16 }, { wch: 16 },
                { wch: 8 },  { wch: 12 }, { wch: 12 }, { wch: 14 }, { wch: 14 }
            ];

            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Proforma Order");
            XLSX.writeFile(workbook, "Yatas_Proforma_Order_Summary.xlsx");
        }
    </script>
</body>
</html>
