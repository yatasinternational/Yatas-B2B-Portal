<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Yataş Group - International B2B Order Portal</title>
    
    <!-- PWA & Mobile Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#00205b">

    <!-- Fonts & Third-Party Libraries -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.3.0/dist/exceljs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #00205b;
            --primary-hover: #00153d;
            --accent: #c5a059;
            --accent-hover: #b08d46;
            --bg-light: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #2b2b2b;
            --text-muted: #6c757d;
            --border-color: #e9ecef;
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header Navigation */
        .header {
            background-color: #ffffff;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }

        .header-container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-logo-clickable {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 1rem;
            text-decoration: none;
            transition: opacity 0.2s ease;
        }

        .brand-logo-clickable:hover {
            opacity: 0.85;
        }

        .brand-logo-img {
            height: 38px;
            object-fit: contain;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .btn-currency {
            background: #f1f3f5;
            border: 1px solid var(--border-color);
            padding: 0.4rem 0.8rem;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            color: var(--primary);
            transition: all 0.2s;
        }

        .btn-currency:hover {
            background: var(--primary);
            color: #ffffff;
        }

        /* Card Layout Updates */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 1.5rem;
            padding: 1.5rem;
            max-width: 1440px;
            margin: 0 auto;
            width: 100%;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .product-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .card-body {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            flex: 1;
        }

        /* Dimension Select Container */
        .dimension-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: var(--radius-sm);
            padding: 0.75rem;
        }

        .dimension-title {
            font-size: 0.7rem;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.4rem;
        }

        .dimension-select {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #cbd5e1;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--primary);
            background: #ffffff;
            margin-bottom: 0.75rem;
            outline: none;
        }

        /* 8-Grid Specs Layout */
        .specs-grid-8 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.35rem;
        }

        .spec-item {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: var(--radius-sm);
            padding: 0.35rem 0.25rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 48px;
        }

        .spec-label {
            font-size: 0.6rem;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            line-height: 1.1;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .spec-value {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--primary);
            line-height: 1.1;
            word-break: break-word;
        }

        .spec-value.mto-status {
            color: #d97706;
        }

        .firmness-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
        }

        .firmness-img {
            height: 14px;
            width: auto;
            object-fit: contain;
        }

        /* Price & Action Row */
        .card-footer-action {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: auto;
            padding-top: 0.5rem;
        }

        .price-display {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--primary);
        }

        .btn-add-cart {
            background: var(--primary);
            color: #ffffff;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: background 0.2s ease;
        }

        .btn-add-cart:hover {
            background: var(--primary-hover);
        }
    </style>
</head>
<body>

    <!-- Header / Navbar -->
    <header class="header">
        <div class="header-container">
            <!-- Tıklanınca Ana Sayfaya Döndüren Logo Alanı -->
            <a href="#" class="brand-logo-clickable" onclick="resetToHome(event)">
                <img src="https://yatasinternational.github.io/Products-Photos/yatas_logo.png" alt="Yataş Group" class="brand-logo-img" onerror="this.style.display='none'">
                <span style="font-weight: 800; color: var(--primary); font-size: 1.1rem; letter-spacing: -0.5px;">YATAŞ GROUP</span>
            </a>

            <div class="nav-actions">
                <button class="btn-currency" id="currencyToggle" onclick="toggleCurrency()">USD ($)</button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main>
        <div id="productGrid" class="product-grid">
            <!-- JavaScript ile Dinamik Doldurulacaktır -->
        </div>
    </main>

    <script>
        let currentCurrency = 'USD';
        let rawProductData = [];

        // Logoya basıldığında ana sayfaya resetleme
        function resetToHome(e) {
            e.preventDefault();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleCurrency() {
            currentCurrency = currentCurrency === 'USD' ? 'EUR' : 'USD';
            document.getElementById('currencyToggle').innerText = currentCurrency === 'USD' ? 'USD ($)' : 'EUR (€)';
            updatePrices();
        }

        function updatePrices() {
            renderGrid(rawProductData);
        }

        function renderProductCard(item) {
            const currencySymbol = currentCurrency === 'USD' ? '$' : '€';
            const priceVal = currentCurrency === 'USD' ? (item['Birim USD Fiyat'] || item['USD Price'] || 0) : (item['Birim EUR Fiyat'] || item['EUR Price'] || 0);
            const formattedPrice = Number(priceVal).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

            return `
                <div class="product-card">
                    <div class="card-body">
                        <div class="dimension-box">
                            <div class="dimension-title">SELECT DIMENSION / SIZE</div>
                            <select class="dimension-select">
                                <option>${item['Ölçü'] || item['Size'] || '090X190'} (${item['Sipariş Statü'] || item['Status'] || 'MTO'})</option>
                            </select>
                            
                            <!-- 8'li Kutucuk Matrisi -->
                            <div class="specs-grid-8">
                                <div class="spec-item">
                                    <div class="spec-label">HS CODE</div>
                                    <div class="spec-value">${item['GTIP'] || item['HS Code'] || '-'}</div>
                                </div>
                                <div class="spec-item">
                                    <div class="spec-label">UNIT VOL</div>
                                    <div class="spec-value">${item['Birim Hacim M3'] ? item['Birim Hacim M3'] + ' m³' : '-'}</div>
                                </div>
                                <div class="spec-item">
                                    <div class="spec-label">UNIT WT</div>
                                    <div class="spec-value">${item['Birim Ağırlık KG'] ? item['Birim Ağırlık KG'] + ' kg' : '-'}</div>
                                </div>
                                <div class="spec-item">
                                    <div class="spec-label">HEIGHT</div>
                                    <div class="spec-value">${item['Yükseklik CM'] ? item['Yükseklik CM'] + ' cm' : '-'}</div>
                                </div>
                                <div class="spec-item">
                                    <div class="spec-label">STATUS</div>
                                    <div class="spec-value mto-status">${item['Sipariş Statü'] || item['Status'] || '-'}</div>
                                </div>
                                <div class="spec-item">
                                    <div class="spec-label">FEATURE</div>
                                    <div class="spec-value">${item['Özellik'] || item['Feature'] || '-'}</div>
                                </div>
                                <div class="spec-item">
                                    <div class="spec-label">COLOR</div>
                                    <div class="spec-value">${item['Renk'] || item['Color'] || '-'}</div>
                                </div>
                                <div class="spec-item">
                                    <div class="spec-label">FIRMNESS</div>
                                    <div class="spec-value firmness-wrapper">
                                        <span>${item['Sertlik'] || item['Firmness'] || '-'}</span>
                                        ${item['Sertlik weblink'] ? `<img src="${item['Sertlik weblink']}" class="firmness-img" alt="firmness">` : ''}
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="card-footer-action">
                            <div class="price-display">${currencySymbol}${formattedPrice}</div>
                            <button class="btn-add-cart"><i class="fa-solid fa-cart-shopping"></i> Add to Order</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderGrid(data) {
            const gridContainer = document.getElementById('productGrid');
            if (!gridContainer) return;
            
            if (!data || data.length === 0) {
                gridContainer.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 3rem; color: var(--text-muted);">No products found to display.</div>`;
                return;
            }

            gridContainer.innerHTML = data.map(item => renderProductCard(item)).join('');
        }

        // Örnek başlangıç verisi ile yükleme
        window.addEventListener('DOMContentLoaded', () => {
            renderGrid(rawProductData);
        });
    </script>
</body>
</html>
